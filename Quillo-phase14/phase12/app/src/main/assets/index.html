(function(){const w=$('#wrap');let d0=0,z0=1,cx=0,cy=0,sl=0,st=0;const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
 w.addEventListener('touchstart',e=>{if(e.touches.length==2){d0=dist(e.touches);z0=z;const r=w.getBoundingClientRect();cx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left;cy=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;sl=w.scrollLeft;st=w.scrollTop}},{passive:true});
 w.addEventListener('touchmove',e=>{if(e.touches.length==2&&d0){e.preventDefault();const nz=Math.max(.25,Math.min(6,z0*dist(e.touches)/d0)),k=nz/z0;setZ(nz);w.scrollLeft=(sl+cx)*k-cx;w.scrollTop=(st+cy)*k-cy;
  const o=$('#zm');let c=o.querySelector('#zc');if(!c){c=new Option('','0');c.id='zc';o.add(c,0)}c.value=nz;c.textContent=Math.round(nz/ZK*100)+'%';o.value=String(nz)}},{passive:false});
 w.addEventListener('touchend',e=>{if(e.touches.length<2)d0=0})})();
</script>

(function(){
 const mkPb=()=>{const d=document.createElement('div');d.className='pb';d.contentEditable='false';d.innerHTML='<span>Page break</span><i class="x" title="Remove break">✕</i>';return d};
 const eP=()=>{const p=document.createElement('p');p.innerHTML='<br>';return p};
 const blank=el=>!el.textContent.trim()&&!el.querySelector('img');
 function insertBreak(wantBlank){restore();const b=curBlock()||ed.lastElementChild;if(!b)return;
  const plain=/^(P|DIV|H[1-6]|BLOCKQUOTE)$/.test(b.tagName)&&!b.classList.contains('sb')&&!b.classList.contains('pb');
  const mid=wantBlank?[mkPb(),eP(),mkPb()]:[mkPb()],nodes=[...mid];
  if(plain&&saved&&b.contains(saved.startContainer)){const rg=document.createRange();rg.setStart(saved.startContainer,saved.startOffset);if(b.lastChild)rg.setEndAfter(b.lastChild);
   const nb=b.cloneNode(false);nb.appendChild(rg.extractContents());if(blank(nb))nb.innerHTML='<br>';if(blank(b))b.innerHTML='<br>';nodes.push(nb)}
  else if(!b.nextElementSibling)nodes.push(eP());
  let a=b;nodes.forEach(n=>{a.after(n);a=n});layout();toast(wantBlank?'Blank page added':'Page break added')}
 $('#iPb').onclick=()=>insertBreak(false);$('#iBlank').onclick=()=>insertBreak(true)})();
</script>
